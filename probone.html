<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Gatekeeper</title>
</head>
<body>
    <script>
        let userentry  = window.prompt("Enter a number 10 through 99: ") ;
        while (Number(userentry) < 10  ||  Number(userentry) > 99){
             userentry = window.prompt("Enter a number 10 through 99: ");
            
        }; 
        
        

    </script>
</body>
</html>
